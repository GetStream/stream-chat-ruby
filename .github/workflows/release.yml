name: Release

on:
  push:
    branches:
      - master

permissions: {}

# One release run at a time, so overlapping pushes cannot build the same version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A merged release PR bumps VERSION, so a version never pushed to RubyGems is a release to finish.
  # The release is always the commit that set VERSION, so a rerun or a later push publishes the
  # reviewed release PR and nothing merged after it.
  check:
    name: 🔎 Check for a new version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # The downloads endpoint also answers 200 for a yanked version, which can never be pushed again.
      - id: version
        run: |
          version="v$(sed -n "s/^ *VERSION = '\(.*\)'$/\1/p" lib/stream-chat/version.rb)"
          test "$version" != v
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 "https://rubygems.org/api/v1/downloads/stream-chat-ruby-${version#v}.json")
          case "$code" in
            200) echo "release=false" >> "$GITHUB_OUTPUT" ;;
            404)
              ref=$(git log -1 --format=%H -S"VERSION = '${version#v}'" -- lib/stream-chat/version.rb)
              tag=$(git rev-parse -q --verify "refs/tags/$version^{commit}" || true)
              if [ -n "$tag" ] && [ "$tag" != "$ref" ]; then
                echo "::error::$version is tagged at $tag, but VERSION was set in $ref"
                exit 1
              fi
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "ref=$ref" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::RubyGems answered $code for $version"; exit 1 ;;
          esac

  build:
    name: 🏗️ Build
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.check.outputs.ref }}

      - id: changelog
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const get_change_log_diff = require('./scripts/get_changelog_diff.js')
            core.setOutput('changelog', get_change_log_diff())

      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.4"

      - name: Build
        run: gem build stream-chat.gemspec

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gem
          path: "*.gem"

  # Tags the release commit before the upload. A rerun keeps the existing release.
  release:
    name: 🚀 Release
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release on GitHub
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          body: ${{ needs.build.outputs.changelog }}
          tag: ${{ needs.check.outputs.version }}
          commit: ${{ needs.check.outputs.ref }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # The only job that can mint a RubyGems token, so it runs no project code. The RubyGems trusted
  # publisher requires the rubygems environment, which only master can deploy to.
  publish:
    name: 💎 Publish to RubyGems
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gem

      - uses: ruby/setup-ruby@20eb24b0d509e2b9ed9b6d42ddfeb992915e0564 # v1.341.0
        with:
          ruby-version: "3.4"

      # Trades the job's OIDC token for a short-lived GEM_HOST_API_KEY.
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems (Trusted Publishing)
        run: gem push ./*.gem
